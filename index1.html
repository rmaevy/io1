<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IO1</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --red: #e61921;
            --black: #000000;
            --white: #ffffff;
            --gray: #f9f9f9;
            --dim-gray: #444;
        }

        /* --- Animationer --- */
        @keyframes headerSlideUp {
            0% { transform: translateY(calc(50vh - 75px)); }
            100% { transform: translateY(0); }
        }

        @keyframes footerSlideDown {
            0% { transform: translateY(calc(-50vh + 50px)); }
            100% { transform: translateY(0); }
        }

        @keyframes mainFadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes textSlideFade {
            0% { opacity: 0; transform: translateX(-20px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        @keyframes lineExpand {
            0% { width: 0; opacity: 0; }
            1% { opacity: 1; }
            100% { width: 100%; opacity: 1; }
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: var(--black);
            overflow-x: hidden;
            box-sizing: border-box;
        }

        *, *:before, *:after {
            box-sizing: inherit;
        }

        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
        }

        /* --- Header --- */
        header {
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--black);
            z-index: 10;
            gap: 20px;
            flex-shrink: 0;
            width: 100%;
            animation: headerSlideUp 1s cubic-bezier(0.85, 0, 0.15, 1) forwards;
        }

        .header-logo {
            width: 72px;
            height: 72px;
            object-fit: contain;
        }

        .header-text-container {
            display: flex;
            flex-direction: column;
        }

        .header-text {
            color: var(--white);
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 900;
            letter-spacing: 2px;
            margin: 0;
            line-height: 1;
            opacity: 0;
            animation: textSlideFade 0.6s ease-out 1s forwards;
        }

        .header-line {
            height: 3px;
            background-color: var(--white);
            margin-top: 5px;
            width: 0;
            opacity: 0;
            animation: lineExpand 0.6s ease-out 1.4s forwards;
        }

        /* --- Main Content --- */
        main {
            flex: 1;
            background-color: var(--white);
            opacity: 0;
            animation: mainFadeIn 0.8s ease-in 0.5s forwards;
            display: flex;
            flex-direction: column;
        }

        .hero {
            padding: 50px 5% 60px;
            text-align: center;
        }

        .hero h1 {
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 900;
            margin: 0 0 20px 0;
            letter-spacing: -2px;
            line-height: 1.1;
            color: var(--black);
        }

        .dot {
            display: inline-block;
            width: 0.15em;
            height: 0.15em;
            background-color: var(--black);
            margin-left: 0.05em;
            vertical-align: baseline;
        }

        .hero span.highlight { color: var(--red); }
        .hero span.highlight .dot { background-color: var(--red); }

        .hero p {
            font-size: 1.2rem;
            max-width: 700px;
            margin: 0 auto 30px;
            color: var(--dim-gray);
            line-height: 1.8;
        }

        .cta-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .cta-button {
            background-color: var(--black);
            color: var(--white);
            padding: 16px 36px;
            text-decoration: none;
            font-weight: 700;
            border-radius: 4px;
            transition: all 0.2s ease;
            display: inline-block;
        }

        .cta-button-v {
            background-color: #333;
            padding: 16px 18px;
            min-width: 40px;
            font-size: 0.9rem;
            text-align: center;
        }

        .cta-button:hover {
            background-color: var(--red);
            transform: translateY(-2px);
        }

        /* --- Feature Sektion --- */
        .features {
            padding: 40px 5%;
            background-color: var(--gray);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .feature-card {
            background: var(--white);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-top: 4px solid var(--black);
            transition: all 0.3s ease;
            text-align: center;
        }

        .feature-img {
            width: 200px;
            height: 200px;
            display: block;
            margin: 0 auto 20px;
            object-fit: cover;
            border-radius: 4px;
            background-color: #eee;
            transition: transform 0.3s ease;
        }

        .feature-card:hover {
            border-top-color: var(--red);
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .feature-card:hover .feature-img {
            transform: scale(1.05);
        }

        .feature-card h3 {
            margin-top: 0;
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 15px;
            color: var(--black);
        }

        .feature-card p {
            margin: 0;
            text-align: left;
            color: var(--dim-gray);
        }

        /* --- Footer --- */
        footer {
            height: 100px;
            background-color: var(--black);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-family: 'Roboto Mono', monospace;
            font-size: 0.85rem;
            z-index: 10;
            flex-shrink: 0;
            animation: footerSlideDown 1s cubic-bezier(0.85, 0, 0.15, 1) forwards;
        }

        .footer-sep {
            color: var(--red);
            margin: 0 0.5ch;
            font-weight: bold;
        }

        /* --- Mobiljusteringar --- */
        @media (max-width: 768px) {
            header { 
                /* Låser höjden stenhårt för att undvika "dubbel höjd" */
                height: 150px !important; 
                min-height: 150px !important;
                max-height: 150px !important;
                gap: 15px; 
                padding: 0;
            }
            .header-logo { 
                width: 72px;
                height: 72px; 
            }
            footer { 
                flex-direction: column; 
                text-align: center; 
                height: auto; 
                padding: 20px 0; 
            }
            .footer-sep { display: none; }
            .cta-container { gap: 8px; }
        }
    </style>
</head>
<body>

    <header>
        <img src="logo.png" alt="IO1 Logo" class="header-logo">
        <div class="header-text-container">
            <div class="header-text">IO1</div>
            <div class="header-line"></div>
